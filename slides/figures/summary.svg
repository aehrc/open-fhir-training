    text { font-family: Carlito, Calibri, sans-serif; fill: #ffffff; }
    .b { font-weight: 700; }
    .title { font-size: 31.33px; }
    .desc { font-size: 18.51px; }
    .icon { fill: none; stroke: #ffffff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .caption text { font-size: 15.5px; fill: #001d34; }
  </style>

  <!-- Get it out -->
