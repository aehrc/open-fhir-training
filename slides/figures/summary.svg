<!--
  Slide "In summary": three tiles (get it out, flatten it, analyse it), each
  with a title, a two-line description and a white line icon, and below them
  QR codes for sql-on-fhir.org, pathling.csiro.au and the training repository,
  captioned beneath. The QR codes encode the full https:// URLs; they are
  version 4 (33 modules), generated with segno at error correction M, which
  segno raises to the highest level that still fits. 3.25 units per module
  keeps the modules on whole pixels when rendered (4 pixels per unit).
  Not layered.
  Slide units (960 x 540 slide, 96 per inch); the viewBox is the region of the
  slide the figure covers. Render with `uv run slides/build.py figures`.
  Author: John Grimes
-->
