  <title>Summary: get it out with Bulk Data $export as NDJSON, flatten it with ViewDefinitions into tables, and analyse it with SQL, Python or R over Pathling, with QR codes linking to sql-on-fhir.org, pathling.csiro.au and github.com/aehrc/open-fhir-training.</title>
