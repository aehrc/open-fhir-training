  <text x="354.94" y="228.3" class="desc">ViewDefinitions turn resources</text>
  <text x="354.94" y="251" class="desc">into tables</text>
  <!-- Table grid icon -->
  <rect x="530.79" y="255.03" width="71.21" height="56.97" rx="4.27" class="icon"/>
  <path d="M530.79 273.55 H602 M530.79 292.06 H602 M555 255.03 V312" class="icon"/>

  <!-- Analyse it -->
  <rect x="643" y="148" width="290" height="180" rx="7.12" fill="#e87722"/>
  <text x="662.94" y="194.4" class="b title">Analyse it</text>
  <text x="662.94" y="228.3" class="desc">SQL, Python or R over</text>
  <text x="662.94" y="251" class="desc">Pathling</text>
